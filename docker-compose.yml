# Faymoos — app Next.js + PostgreSQL (usage local / démo mémoire)
# Démarrage : docker compose up --build
# URL : http://localhost:3000  |  PostgreSQL : localhost:5432

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faymoos
      POSTGRES_PASSWORD: faymoos_dev
      POSTGRES_DB: faymoos
    volumes:
      - faymoos_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faymoos -d faymoos"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://faymoos:faymoos_dev@db:5432/faymoos
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://faymoos:faymoos_dev@db:5432/faymoos
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BILLING_DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  faymoos_pgdata:
