# Pipeline CI — lint, tests Vitest, build production Next.js
# Nécessite un runner GitLab avec Docker ou shell ; cache npm accélère les jobs.

default:
  image: node:20-bookworm
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint:ci

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
